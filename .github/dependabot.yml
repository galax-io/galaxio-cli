version: 2

multi-ecosystem-groups:
  go-runtime:
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: gomod
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: go-runtime

  - package-ecosystem: docker
    directory: /
    patterns:
      - golang
      - gcr.io/distroless/static-debian12
    multi-ecosystem-group: go-runtime
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci(deps)"
