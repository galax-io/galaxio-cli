name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: "80.0"
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf "coverage %.1f%% is below required %.1f%%\n", coverage, threshold
              exit 1
            }
            printf "coverage %.1f%% meets required %.1f%%\n", coverage, threshold
          }'

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -trimpath -o dist/galaxio ./cmd/galaxio

  docker-image:
    name: docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"
          image_tag="galax-io/galaxio:pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::12}"

          {
            echo "build_args<<EOF"
            printf 'VERSION=dev\nCOMMIT=%s\nDATE=%s\n' "${commit}" "${date}"
            echo "EOF"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.buildmeta.outputs.image_tag }}
          build-args: ${{ steps.buildmeta.outputs.build_args }}
          provenance: false

      - name: Validate image with utility command
        run: docker run --rm ${{ steps.buildmeta.outputs.image_tag }} version

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./...
