name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: "80.0"
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf "coverage %.1f%% is below required %.1f%%\n", coverage, threshold
              exit 1
            }
            printf "coverage %.1f%% meets required %.1f%%\n", coverage, threshold
          }'

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -trimpath -o dist/galaxio ./cmd/galaxio
