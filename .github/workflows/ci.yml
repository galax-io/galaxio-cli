name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: "80.0"
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf "coverage %.1f%% is below required %.1f%%\n", coverage, threshold
              exit 1
            }
            printf "coverage %.1f%% meets required %.1f%%\n", coverage, threshold
          }'

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -trimpath -o dist/galaxio ./cmd/galaxio

  shell-suites:
    name: shell suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run every shell suite
        # A suite that exists but is not enrolled in CI is not a release guard.
        # The floor catches a future glob typo or an accidentally removed suite.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(scripts/*_test.sh .claude/hooks/*_test.sh .githooks/*_test.sh)
          [ "${#suites[@]}" -ge 4 ] || { echo "found ${#suites[@]} shell suites, expected at least 4"; exit 1; }
          for t in "${suites[@]}"; do
            echo "--- $t"
            bash "$t"
          done

  linkage:
    name: linkage
    runs-on: ubuntu-latest
    # Main receives only green PRs; the tag-triggered workflow performs the
    # release-range audit separately. These explicit reads are required because
    # a job-level permissions block clears scopes not named here.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check issue, PR and milestone linkage
        run: scripts/check-linkage.sh --pr "$PR_NUMBER"

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up the JDK the etalon runs on
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the t-digest jars the etalon runs
        uses: ./.github/actions/tdigest-jars

      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./...
