name: release-build

# The release workflow of the repository (BCKLG-1038, trunk-based): all work is on main; a minor
# version vX.Y.0 cuts release/X.Y.0 from main, and its patches vX.Y.Z are tagged on that branch after
# the fix is cherry-picked from main. The branch is never merged back. Two phases that
# scripts/release-phase.sh runs, started by the maintainer or by the release build of
# galaxio-sdlc-backlog under the maintainer's account (never by an agent or a stage):
#
#   prepare  vX.Y.0: release/X.Y.0 cut from main when it does not exist; a patch needs the branch.
#            The checks of the repository (the `# lint` and `# test` lines of AGENTS.md) run on its
#            head; no tag, main untouched
#   publish  after a green prepare of that very head: the tag `version` on it and the GitHub Release;
#            the branch stays, main untouched
#
# The outcome is the artifact `release-result` (JSON). A repository whose checks need a toolchain
# installs it in a step of its own before `release-phase`.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "prepare or publish"
        type: choice
        required: true
        options: [prepare, publish]
      release:
        description: "Id of the release (the milestone's title up to its first em dash, lowercased), e.g. m1.0.9"
        type: string
        required: true
      version:
        description: "Version of the repository, vX.Y.Z; it names the branch release/X.Y.0"
        type: string
        required: true

concurrency:
  group: release-${{ inputs.release }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # The phases push the release branch, its mark and the tag with this token.
          persist-credentials: true

      - name: release-phase
        # Inputs reach the script as environment, never inside the command: the script checks them
        # (release ^[a-z0-9.]+$, version ^v[0-9]+\.[0-9]+\.[0-9]+$) before it writes anything.
        run: |
          args=(--release "$RELEASE" --result "$RUNNER_TEMP/release-result.json")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          bash scripts/release-phase.sh "$PHASE" "${args[@]}"
        env:
          PHASE: ${{ inputs.phase }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: release-result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-result
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: ignore
