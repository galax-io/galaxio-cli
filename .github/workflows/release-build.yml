name: release-build

# The release workflow of the repository (BCKLG-1030): one branch release/<id> per release, and
# three phases that scripts/release-phase.sh runs, started by the maintainer or by the release build
# of galaxio-sdlc-backlog under the maintainer's account (never by an agent or a stage):
#
#   open     release/<release> from main
#   prepare  rebase of the branch onto main, the checks of the repository (the `# lint` and `# test`
#            lines of AGENTS.md) on it, no tag
#   publish  after a green prepare of that very head: fast-forward of main, the tag `version` on main,
#            the GitHub Release, the branch deleted. With no branch (an urgent release) the tag is set
#            on the current main.
#
# The outcome is the artifact `release-result` (JSON). A repository whose checks need a toolchain
# installs it in a step of its own before `release-phase`.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "open, prepare or publish"
        type: choice
        required: true
        options: [open, prepare, publish]
      release:
        description: "Id of the release (the milestone's title up to its first em dash, lowercased), e.g. m1.0.9"
        type: string
        required: true
      version:
        description: "Version of the repository, vX.Y.0; required by publish"
        type: string
        required: false

concurrency:
  group: release-${{ inputs.release }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # The phases push the branch, main and the tag with this token.
          persist-credentials: true

      - name: release-phase
        # Inputs reach the script as environment, never inside the command: the script checks them
        # (release ^[a-z0-9.]+$, version ^v[0-9]+\.[0-9]+\.0$) before it writes anything.
        run: |
          args=(--release "$RELEASE" --result "$RUNNER_TEMP/release-result.json")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          bash scripts/release-phase.sh "$PHASE" "${args[@]}"
        env:
          PHASE: ${{ inputs.phase }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: release-result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-result
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: ignore
