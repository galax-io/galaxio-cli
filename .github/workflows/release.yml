name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: build and validate image
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: galax-io/galaxio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"
          image_tag="${IMAGE_NAME}:release-${GITHUB_SHA::12}"

          {
            echo "build_args<<EOF"
            printf 'VERSION=%s\nCOMMIT=%s\nDATE=%s\n' "${version}" "${commit}" "${date}"
            echo "EOF"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.buildmeta.outputs.image_tag }}
          build-args: ${{ steps.buildmeta.outputs.build_args }}
          provenance: false

      - name: Validate image with utility command
        run: docker run --rm ${{ steps.buildmeta.outputs.image_tag }} version

  docker-publish:
    name: docker publish
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: galax-io/galaxio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"

          {
            echo "build_args<<EOF"
            printf 'VERSION=%s\nCOMMIT=%s\nDATE=%s\n' "${version}" "${commit}" "${date}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          minor_patch="${version#*.}"
          minor="${minor_patch%%.*}"

          {
            echo "tags<<EOF"
            printf '%s\n' \
              "${IMAGE_NAME}:latest" \
              "${IMAGE_NAME}:${version}" \
              "${IMAGE_NAME}:${major}.${minor}" \
              "${IMAGE_NAME}:${major}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.buildmeta.outputs.build_args }}
          provenance: false
