name: docker-publish

on:
  workflow_run:
    workflows:
      - release
    types:
      - completed

permissions:
  contents: read

env:
  IMAGE_NAME: galax-io/galaxio

jobs:
  build-and-validate:
    name: build and validate image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build and validate image
        uses: ./.github/actions/docker-build-validate
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          image_name: galax-io/galaxio

  publish:
    name: publish image
    needs: build-and-validate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail

          version="$(git describe --tags --exact-match HEAD)"
          semver="${version#v}"
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"

          {
            echo "build_args<<EOF"
            printf 'VERSION=%s\nCOMMIT=%s\nDATE=%s\n' "${semver}" "${commit}" "${date}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          version="$(git describe --tags --exact-match HEAD)"
          semver="${version#v}"
          remainder="${semver#*.}"
          minor="${semver%%.*}.${remainder%%.*}"

          {
            echo "tags<<EOF"
            printf '%s\n' \
              "${IMAGE_NAME}:${semver}" \
              "${IMAGE_NAME}:${minor}" \
              "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.buildmeta.outputs.build_args }}
          provenance: false
